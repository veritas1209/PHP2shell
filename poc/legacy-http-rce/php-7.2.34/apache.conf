KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers            1
    MinSpareServers         1
    MaxSpareServers         1
    MaxRequestWorkers       1
    ServerLimit             1
    MaxConnectionsPerChild  4
</IfModule>

<VirtualHost *:80>
    ServerName target
    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:80>
    ServerName php2shell-72-target
    DocumentRoot /var/www/html

    php_admin_value memory_limit 12M
    php_admin_value post_max_size 64M
    php_admin_value upload_max_filesize 64M
    php_admin_value max_input_vars 1000
    php_admin_flag file_uploads On

    php_admin_flag display_errors Off
    php_admin_flag display_startup_errors Off
    php_admin_flag log_errors Off
    php_admin_value error_reporting 0
    php_admin_flag html_errors Off

    php_admin_value session.save_path /tmp
    php_admin_flag session.use_strict_mode Off
    php_admin_flag session.use_cookies On
    php_admin_flag session.use_only_cookies On
    php_admin_flag session.use_trans_sid Off
    php_admin_flag session.upload_progress.enabled On
    php_admin_flag session.upload_progress.cleanup On
</VirtualHost>
